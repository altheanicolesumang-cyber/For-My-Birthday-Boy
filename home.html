<!doctype html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>For My Birthday Boy</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap');

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#080808;
    color:#f5f2ed;
    font-family:'Cormorant Garamond',serif;
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;

    overflow-x:hidden;
    overflow-y:auto;

    padding:50px 0;
}

/* VINTAGE GRAIN */

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.08;

    background-image:repeating-linear-gradient(
        0deg,
        #fff 0 1px,
        transparent 1px 4px
    );

    z-index:10;
}

/* FADE */

.fade{
    animation:fade 1.3s ease both;
}

@keyframes fade{

    from{
        opacity:0;
        transform:translateY(25px);
    }

    to{
        opacity:1;
        transform:none;
    }

}

/* MAIN */

.wrap{
    width:92%;
    max-width:900px;
    position:relative;
    padding:55px 25px;
    margin:auto;
}

/* HEART */

.heart{
    font-size:70px;
    color:#b40018;

    animation:pulse 1.5s infinite;

    opacity:0;
    animation-delay:.3s;
    animation-fill-mode:forwards;

    text-shadow:
        0 5px 0 #65000d,
        0 10px 20px #b4001855;
}

@keyframes pulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.18);
    }

}

/* TITLE */

h1{
    font-size:clamp(42px,8vw,78px);
    letter-spacing:6px;
    text-transform:uppercase;
    margin:10px 0;

    color:#fff;

    animation:title 1.4s ease .7s both;

    text-shadow:
        3px 3px 0 #40000a,
        0 8px 20px #000;
}

@keyframes title{

    from{
        opacity:0;
        letter-spacing:20px;
    }

    to{
        opacity:1;
        letter-spacing:6px;
    }

}

.sub{
    font-size:21px;
    color:#cfcfcf;
    font-style:italic;

    animation:fade 1s 1.5s both;
}

/* FOUR CARDS */

.items{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;

    margin-top:45px;
}

/* CARD */

.item{
    position:relative;

    color:#fff;
    text-decoration:none;

    border:1px solid #444;

    background:
        linear-gradient(
            145deg,
            #1d1d1d,
            #090909
        );

    padding:28px 10px 24px;

    min-height:145px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    transition:
        transform .4s ease,
        border-color .4s ease,
        box-shadow .4s ease;

    animation:rise .8s ease both;

    box-shadow:
        inset 0 1px 0 #ffffff12,
        0 10px 25px #000;
}

/* CARD ANIMATION */

.item:nth-child(1){
    animation-delay:1.9s;
}

.item:nth-child(2){
    animation-delay:2.1s;
}

.item:nth-child(3){
    animation-delay:2.3s;
}

.item:nth-child(4){
    animation-delay:2.5s;
}

@keyframes rise{

    from{
        opacity:0;
        transform:translateY(45px) scale(.9);
    }

    to{
        opacity:1;
        transform:none;
    }

}

/* 3D HOVER */

.item:hover{

    border-color:#d00020;

    background:
        linear-gradient(
            145deg,
            #250309,
            #0d0002
        );

    transform:
        translateY(-12px)
        perspective(500px)
        rotateX(5deg)
        rotateY(-4deg);

    box-shadow:
        0 20px 35px #000,
        0 0 30px #a0002044;
}

/* 3D ICON */

.emoji{

    display:block;

    font-size:52px;

    margin-bottom:12px;

    color:#d00020;

    line-height:1;

    transform:
        perspective(300px)
        translateZ(20px);

    filter:
        drop-shadow(0 5px 0 #62000d)
        drop-shadow(0 10px 12px #000);

    transition:
        transform .4s ease,
        filter .4s ease;
}

/* ICON FLOAT */

.item:hover .emoji{

    transform:
        perspective(300px)
        translateZ(45px)
        rotate(-8deg)
        scale(1.18);

    filter:
        drop-shadow(0 7px 0 #62000d)
        drop-shadow(0 15px 15px #000)
        drop-shadow(0 0 12px #d0002055);
}

/* LITTLE RED LINE */

.item:after{

    content:"";

    position:absolute;

    bottom:0;
    left:15%;
    width:70%;

    height:2px;

    background:#b0001b;

    transform:scaleX(0);

    transition:.4s ease;
}

.item:hover:after{
    transform:scaleX(1);
}

/* FOOTER */

.small{
    margin-top:40px;

    color:#777;

    font-size:14px;

    font-style:italic;

    animation:fade 1s 3s both;
}

/* TABLET */

@media(max-width:750px){

    .items{
        grid-template-columns:1fr 1fr;
    }

}

/* PHONE */

@media(max-width:450px){

    body{
        padding:30px 0;
    }

    .wrap{
        padding:40px 15px;
    }

    .items{
        grid-template-columns:1fr;
    }

    .item{
        min-height:130px;
    }

    h1{
        font-size:44px;
    }

    .sub{
        font-size:19px;
    }

}

</style>

</head>

<body>

<div class="wrap fade">

    <div class="heart">
        ♥
    </div>

    <h1>
        To the Boy I Love
    </h1>

    <p class="sub">
        A little collection of memories, moments, and love — just for you.
    </p>

    <div class="items">

        <!-- MEMORIES -->

        <a class="item" href="pics.html">

            <span class="emoji">
                📸
            </span>

            MEMORIES

        </a>

        <!-- VIDEO -->

        <a class="item" href="youtube.html">

            <span class="emoji">
                🎞️
            </span>

            VIDEO

        </a>

        <!-- NOTE -->

        <a class="item" href="note.html">

            <span class="emoji">
                💌
            </span>

            MY NOTE

        </a>

        <!-- FINAL SURPRISE -->

        <a class="item" href="cake.html">

            <span class="emoji">
                🎂
            </span>

            FINAL SURPRISE

        </a>

    </div>

    <p class="small">
        made with love, chaos and a little sass.
    </p>

</div>

</body>
</html>
