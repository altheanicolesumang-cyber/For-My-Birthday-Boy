<!doctype html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Happy Birthday</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap');

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#070707;
    color:#f5f2ed;
    font-family:'Cormorant Garamond',serif;

    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;

    overflow-x:hidden;
    overflow-y:auto;

    padding:40px 0;
}

/* VINTAGE GRAIN */

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.08;
    background-image:repeating-linear-gradient(
        0deg,
        #fff 0 1px,
        transparent 1px 4px
    );
    z-index:10;
}

.wrap{
    width:92%;
    max-width:850px;
    padding:50px 20px;
    animation:open 1.5s ease both;
}

@keyframes open{

    from{
        opacity:0;
        transform:translateY(35px);
    }

    to{
        opacity:1;
        transform:none;
    }

}

/* HEART */

.heart{
    color:#c4001b;
    font-size:70px;
    animation:pulse 1.6s ease-in-out infinite;
}

@keyframes pulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.15);
    }

}

/* SMALL TEXT */

.top{
    color:#999;
    font-size:19px;
    font-style:italic;
    letter-spacing:2px;
}

/* TITLE */

h1{
    margin:15px 0 5px;
    font-size:clamp(50px,9vw,90px);
    line-height:.95;
    letter-spacing:6px;
    text-transform:uppercase;
    animation:title 1.4s ease .3s both;
}

@keyframes title{

    from{
        opacity:0;
        letter-spacing:25px;
    }

    to{
        opacity:1;
        letter-spacing:6px;
    }

}

.red{
    color:#c4001b;
}

/* SUBTITLE */

.sub{
    color:#ccc;
    font-size:22px;
    font-style:italic;
    margin:25px 0 40px;
    animation:fade 1s 1s both;
}

@keyframes fade{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }

}

/* OPEN BUTTON */

.open{
    display:inline-block;
    color:#fff;
    border:1px solid #c4001b;
    padding:15px 35px;
    text-decoration:none;
    font-size:18px;
    letter-spacing:3px;
    text-transform:uppercase;
    transition:.4s;
    animation:fade 1s 1.4s both;
}

.open:hover{
    background:#c4001b;
    box-shadow:0 0 30px #c4001b55;
    transform:translateY(-4px);
}

/* LITTLE FOOTER */

.small{
    margin-top:35px;
    color:#666;
    font-size:14px;
    font-style:italic;
}

</style>

</head>

<body>

<div class="wrap">

    <div class="heart">
        ♥
    </div>

    <div class="top">
        today is all about you.
    </div>

    <h1>
        Happy<br>
        <span class="red">Birthday</span>
    </h1>

    <p class="sub">
        To my favorite birthday boy.
    </p>

    <a class="open" href="home.html">
        OPEN YOUR SURPRISE →
    </a>

    <p class="small">
        made with love, chaos, and a little bit of sass.
    </p>

</div>

</body>
</html>
