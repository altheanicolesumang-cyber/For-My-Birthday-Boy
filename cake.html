<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Final Surprise</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap');

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#090909;
    color:#f5f2ed;
    font-family:'Cormorant Garamond',serif;
    min-height:100vh;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.08;
    background-image:repeating-linear-gradient(
        0deg,
        #fff 0 1px,
        transparent 1px 4px
    );
    z-index:10;
}

.fade{
    animation:fade 1.3s ease both;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(25px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

body{
    background:#050505;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;

    /* FIXED: allows scrolling */
    overflow-x:hidden;
    overflow-y:auto;

    padding:60px 0;
}

.wrap{
    max-width:800px;
    width:92%;
    padding:30px;
}

.hint{
    color:#999;
    font-style:italic;
    font-size:20px;
    animation:fade 1s both;
}

.cake{
    font-size:145px;
    cursor:pointer;
    animation:cake 1.8s ease-in-out infinite;
    filter:drop-shadow(0 0 20px #b0001b55);
    transition:.3s;
}

.cake:hover{
    transform:scale(1.08);
}

@keyframes cake{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-13px);
    }
}

.click{
    color:#b0001b;
    letter-spacing:2px;
    font-size:18px;
}

.message{
    display:none;
    animation:reveal 1.2s ease both;
    padding-bottom:30px;
}

@keyframes reveal{
    from{
        opacity:0;
        transform:scale(.5);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

h1{
    font-size:clamp(35px,7vw,65px);
    text-transform:uppercase;
    letter-spacing:4px;
    color:#fff;
}

.message p{
    font-size:21px;
    color:#ddd;
    line-height:1.6;
}

.back{
    display:inline-block;
    margin-top:20px;
    color:#fff;
    border:1px solid #b0001b;
    padding:12px 25px;
    text-decoration:none;
    transition:.3s;
    font-size:17px;
}

.back:hover{
    background:#b0001b;
}

.piece{
    position:fixed;
    top:-30px;
    color:#b0001b;
    font-size:26px;
    animation:fall 3.5s linear forwards;
    pointer-events:none;
    z-index:5;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(720deg);
        opacity:0;
    }
}

@media(max-width:500px){

    body{
        padding:40px 0;
    }

    .cake{
        font-size:110px;
    }

    .wrap{
        padding:20px;
    }

    .message p{
        font-size:18px;
    }

}

</style>
</head>

<body>

<div class="wrap">

    <p class="hint">
        One last thing...
    </p>

    <div class="cake" id="cake" onclick="surprise()">
        🎂
    </div>

    <p class="click">
        CLICK THE CAKE ♥
    </p>

    <div class="message" id="message">

        <h1>
            Happy Birthday, My Fil
        </h1>

        <p>
            You made it to the end. ♥
        </p>

        <p>
            Which means you officially survived my little birthday website.
        </p>

        <p>
            <b>
                And unfortunately for you... you're stuck with me.
            </b>
        </p>

        <p>
            Thank you so much for existing.
        </p>

        <a class="back" href="index.html">
            ← BACK
        </a>

    </div>

</div>

<script>

function surprise(){

    document.getElementById('cake').textContent='🎂';

    document.getElementById('cake').onclick=null;

    document.getElementById('message').style.display='block';

    for(let i=0;i<55;i++){

        let p=document.createElement('span');

        p.className='piece';

        p.textContent=['♥','✦','✧','❤'][Math.floor(Math.random()*4)];

        p.style.left=Math.random()*100+'%';

        p.style.animationDelay=Math.random()*1.5+'s';

        document.body.appendChild(p);
    }

}

</script>

</body>
</html>
